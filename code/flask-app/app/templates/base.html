<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prompt Tester</title>
    <style>
        /* ===== Reset & Base ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #eef2f7, #f8fafc);
            color: #1f2937;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
            color: #111827;
            letter-spacing: -0.5px;
        }

        /* ===== Container ===== */
        .container {
            max-width: 820px;
            margin: auto;
            background: #ffffff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        /* ===== Form Elements ===== */
        label {
            display: block;
            margin-top: 22px;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #374151;
        }

        textarea, input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            background: #ffffff;
            transition: all 0.2s ease;
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        /* Focus state (big UX upgrade) */
        textarea:focus, input:focus {
            outline: none;
            border-color: #2d6cdf;
            box-shadow: 0 0 0 3px rgba(45,108,223,0.15);
        }

        /* ===== Button ===== */
        button {
            margin-top: 24px;
            padding: 12px 20px;
            border: none;
            background: linear-gradient(135deg, #2d6cdf, #1f4fb3);
            color: white;
            font-size: 15px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(45,108,223,0.25);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(45,108,223,0.3);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 3px 8px rgba(45,108,223,0.2);
        }

        /* ===== Response Box ===== */
        .response-box {
            margin-top: 10px;
            padding: 16px;
            background: #f9fafb;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            min-height: 90px;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Separate response sections visually */
        label + .response-box {
            margin-bottom: 10px;
        }

        /* ===== Footer ===== */
        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Prompt Injection Tester</h1>

        <form method="POST" action="{{ url_for('main.home') }}">
            <label for="prompt">Prompt</label>
            <textarea name="prompt" id="prompt" placeholder="Enter the main prompt...">{{ request.form.prompt }}</textarea>

            <label for="data">Data</label>
            <textarea name="data" id="data" placeholder="Enter external data or context...">{{ request.form.data }}</textarea>

            <button type="submit">Submit</button>
        </form>

        {% if response %}
            <label>Response with template</label>
            <div class="response-box">{{ response.message.content }}</div>
            <label>Response without template</label>
            <div class="response-box">{{ response2.message.content }}</div>
        {% endif %}

        <div class="footer">
            Current model: {{ model  }}
        </div>
    </div>

</body>
</html>
